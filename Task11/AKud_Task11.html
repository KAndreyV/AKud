<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Гений</title>
</head>
<body>
    <h1 id="title">Математический гений</h1>

    Введите первое число: <input id="num1" /> <br />
    Введите второе число: <input id="num2" /> <br />
    <button id="btn">Проконсультируйтесь с гением</button>

    <script>
        let title = document.getElementById("title");
        let num1 = document.getElementById("num1");
        let num2 = document.getElementById("num2");
        let btn = document.getElementById("btn");

        btn.onclick = function () {
            let a = Number(num1.value);
            let b = Number(num2.value);

            if (a < b) {
                title.textContent = a + " меньше, чем " + b;
            } else if (a > b) {
                title.textContent = a + " больше, чем " + b;
            } else {
                title.textContent = a + " равно " + b;
            }
        };
    </script>
</body>
</html>
